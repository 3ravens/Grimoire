# cargo-deny configuration — license audit for Grimoire.
#
# Grimoire ships under GPL-3.0-or-later, so every Cargo dependency must carry a
# GPL-compatible license. Permissive licenses (MIT, Apache-2.0, BSD, ISC, etc.)
# and weak copyleft (LGPL, MPL-2.0) are GPL-compatible. Strong copyleft that is
# incompatible (e.g. SSPL) and proprietary/unlicensed crates are rejected by
# omission from the `allow` list below.
#
# Run locally:  cargo deny --manifest-path src-tauri/Cargo.toml check licenses
# CI enforces this via the `license-audit` job.

[graph]
# Audit every target we ship for (Windows is the primary dev platform but the
# release matrix also builds macOS and Linux).
all-features = false

[licenses]
# Only these SPDX license expressions are permitted. Anything not listed fails
# the check, which is the intended fail-closed behaviour for a GPL project.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "LGPL-2.1",
    "LGPL-2.1-or-later",
    "LGPL-3.0",
    "GPL-3.0",
    "GPL-3.0-or-later",
    # Our vendored libzim bridges (vendor/zim-sys, vendor/zim-rs). GPL-2.0-or-later
    # is upward-compatible with this project's GPL-3.0-or-later license.
    "GPL-2.0-or-later",
    # webpki-roots ships Mozilla's CA certificate bundle (pulled transitively by
    # lancedb → aws-config → hyper-rustls). CDLA-Permissive-2.0 is a permissive,
    # non-copyleft data license and imposes no restrictions incompatible with GPL.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# Per-crate exceptions are added here during triage with a justification comment
# (e.g. crates whose license is GPL-compatible but expressed unusually).
exceptions = []

[licenses.private]
# Our own crates (the workspace) are not published; ignore them.
ignore = true
