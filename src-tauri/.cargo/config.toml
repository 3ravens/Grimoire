# Cargo configuration for the Grimoire Tauri crate.
#
# Windows CXXFLAGS for zim-sys are NOT set here (target [env] tables do not
# support the { value, force } form). CI sets CXXFLAGS via scripts/ci/windows-vcpkg.ps1;
# local Windows dev: run that script or set CXXFLAGS=/I%VCPKG_ROOT%\installed\x64-windows\include.

[env]
# Set RUST_LOG in your shell to override (force = false).
RUST_LOG = { value = "warn,app=info", force = false }
