[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"
# `perf-budget` and `search-quality` are extra [[bin]] targets; `tauri dev` runs `cargo run` without `--bin`.
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "perf-budget"
path = "src/bin/perf-budget.rs"

[[bin]]
name = "search-quality"
path = "src/bin/search-quality.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
lancedb = "0.14"
arrow-array = "53"
arrow-schema = "53"
futures = "0.3"
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
sysinfo = "0.33"
zim-sys = "0.1.0"
zim-rs = "0.1.1"
sha2 = "0.10"
roxmltree = "0.20"
scraper = "0.22"
rayon = "1"
pdf-extract = "0.7"
zip = { version = "3", default-features = false, features = ["deflate"] }
csv = "1.4.0"
encoding_rs = "0.8.35"
chardetng = "0.1"
globset = "0.4"
epub = "2.1.5"
rtf-parser = "0.4.2"
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
] }

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
# Local forks of zim-sys and zim-rs with the Searcher/Search/Query API removed.
# These classes were dropped in libzim 9.x (search.h no longer exists).
# We don't need full-text search via libzim — LanceDB handles that.
zim-sys = { path = "../vendor/zim-sys" }
zim-rs = { path = "../vendor/zim-rs" }
