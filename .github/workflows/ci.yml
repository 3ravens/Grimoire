# PR/main CI — least-privilege token; actions pinned to commit SHAs (see comments).
name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-sync:
    name: Version sync
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1634565d49a17c8071892bcca1
        with:
          persist-credentials: false
      # actions/setup-node@v4.1.0
      - uses: actions/setup-node@3938e6284a573c84089c26aaa2caf91994e67fa
        with:
          node-version: lts/*
      - name: Check version alignment
        run: bash scripts/ci/check-version-sync.sh

  test:
    name: Test (${{ matrix.platform }})
    needs: version-sync
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-15-intel
            platform: macos-intel
          - os: macos-14
            platform: macos-arm
          - os: ubuntu-22.04
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1634565d49a17c8071892bcca1
        with:
          persist-credentials: false

      - name: Install Linux native dependencies
        if: matrix.platform == 'linux'
        run: bash scripts/ci/linux-deps.sh

      - name: Install macOS native dependencies
        if: startsWith(matrix.platform, 'macos')
        run: bash scripts/ci/macos-deps.sh

      - name: Install Windows native dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: scripts/ci/windows-vcpkg.ps1

      - name: Install protoc (Windows)
        if: matrix.platform == 'windows'
        # arduino/setup-protoc@v3.0.0
        uses: arduino/setup-protoc@77c8bc95bb8b29e7c6467c44a94d27118b78803b
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@3938e6284a573c84089c26aaa2caf91994e67fa
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

      # dtolnay/rust-toolchain@stable (pinned 2024-04)
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@e87dbbc7b8c29e77e3d70e699bdd2699c107b7b2
        with:
          toolchain: stable

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --locked

      - name: Tauri debug bundle smoke (Linux)
        if: matrix.platform == 'linux'
        run: npm run tauri build -- --debug

      - name: Tauri debug bundle smoke (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: npm run tauri build -- --debug
