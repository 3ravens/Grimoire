name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Check version alignment
        run: bash scripts/ci/check-version-sync.sh

  test:
    needs: version-sync
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: macos-13
            platform: macos-intel
          - os: macos-14
            platform: macos-arm
          - os: ubuntu-22.04
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux native dependencies
        if: matrix.platform == 'linux'
        run: bash scripts/ci/linux-deps.sh

      - name: Install macOS native dependencies
        if: startsWith(matrix.platform, 'macos')
        run: bash scripts/ci/macos-deps.sh

      - name: Cache vcpkg (Windows)
        if: matrix.platform == 'windows'
        uses: actions/cache@v4
        with:
          path: vcpkg
          key: vcpkg-libzim-${{ runner.os }}-${{ hashFiles('scripts/ci/windows-vcpkg.ps1') }}

      - name: Install Windows native dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: scripts/ci/windows-vcpkg.ps1

      - name: Install protoc (Windows)
        if: matrix.platform == 'windows'
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run frontend tests
        run: npm test

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run Rust tests
        working-directory: src-tauri
        env:
          VCPKG_ROOT: ${{ matrix.platform == 'windows' && format('{0}/vcpkg', github.workspace) || '' }}
          CXXFLAGS: ${{ matrix.platform == 'windows' && format('/I{0}/vcpkg/installed/x64-windows/include', github.workspace) || '' }}
        run: cargo test --locked

      - name: Tauri debug bundle smoke (Linux)
        if: matrix.platform == 'linux'
        run: npm run tauri build -- --debug

      - name: Tauri debug bundle smoke (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: npm run tauri build -- --debug
